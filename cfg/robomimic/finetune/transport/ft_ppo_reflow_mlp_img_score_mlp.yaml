###########################################
env_suite: robomimic
env_name: transport

action_dim: 14
cond_steps: 1
horizon_steps: 8
act_steps: 8

obs_dim: 18
img_cond_steps: 1

gamma_score: 1.0
###########################################
# EpsNet: learned ε(t) via MLP, drift & diffusion coupled
# SDE: dxt = [vt + α(t)·st] dt + √(2·α(t)) dWt
###########################################

defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.reinflow.train_ppo_flow_agent_score_mlp.TrainPPOImgFlowEpsNetAgent
name: ${env_name}_ft_flow_mlp_img_score_epsnet_ta${horizon_steps}_td${denoising_steps}_gamma${gamma_score}_seed${seed}
logdir: ${oc.env:REINFLOW_LOG_DIR}/robomimic/finetune/${env_name}_ft_flow_mlp_img_score_epsnet_ta${horizon_steps}_td${denoising_steps}/${now:%Y-%m-%d}_${now:%H-%M-%S}_gamma${gamma_score}_${seed}
base_policy_path: ${oc.env:REINFLOW_LOG_DIR}/robomimic/pretrain/transport/ReFlow/state_2000.pt
robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}-img.json
normalization_path: ${oc.env:REINFLOW_DATA_DIR}/robomimic/${env_name}-img/normalization.npz
resume_path: null
seed: 42
device: cuda:0
sim_device: cuda:0
###########################################
denoising_steps: 4
# EpsNet parameters
epsilon_t: 0.1           # 基准噪声系数（用于初始化 MLP 输出量级）
eps_mlp_hidden_dim: 32   # EpsNet MLP 隐藏层维度
eps_mlp_type: mlp        # 'mlp', 'linear', 'fixed'
eps_max_clamp: 2.0       # α(t) 最大值裁剪倍率
###########################################

env:
  n_envs: 50
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 800
  save_video: false
  use_image_obs: true
  wrappers:
    robomimic_image:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                     'robot0_eef_quat',
                     'robot0_gripper_qpos',
                     "robot1_eef_pos",
                     "robot1_eef_quat",
                     "robot1_gripper_qpos"]
      image_keys: ['shouldercamera0_image',
                   'shouldercamera1_image']
      shape_meta: ${shape_meta}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true

shape_meta:
  obs:
    rgb:
      shape: [6,96,96]
    state:
      shape: [18]
  action:
    shape: [14]

wandb:
  entity: ${oc.env:REINFLOW_WANDB_ENTITY}
  project: robomimic-${env_name}-finetune
  run: ${now:%Y-%m-%d}_${now:%H-%M-%S}_${name}
  offline_mode: false
train:
  n_train_itr: 201
  n_critic_warmup_itr: 2
  n_steps: 400
  gamma: 0.999
  augment: true
  grad_accumulate: 20
  actor_lr: 3.5e-06
  actor_weight_decay: 0
  actor_lr_scheduler:
    type: cosine
    first_cycle_steps: 100
    warmup_steps: 10
    min_lr: 3.5e-06
  critic_lr: 4.5e-4
  critic_weight_decay: 0
  critic_lr_scheduler:
    type: cosine
    first_cycle_steps: 100
    warmup_steps: 25
    min_lr: 3e-4
  save_model_freq: 100
  val_freq: 10
  render:
    freq: 1
    num: 0
  reward_scale_running: true
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 500
  logprob_batch_size: 1000
  update_epochs: 10
  vf_coef: 0.5
  ent_coef: 0.01
  target_kl: 0.01
  lr_schedule: fixed
  repeat_samples: true
  verbose: false
  clip_intermediate_actions: true
  account_for_initial_stochasticity: true
  max_grad_norm: 25.0
model:
  _target_: model.flow.ft_ppo.ppoflow_score_mlp.PPOFlowEpsNet
  device: ${device}
  gamma_score: ${gamma_score}
  actor_policy_path: ${base_policy_path}
  policy:
    _target_: model.flow.mlp_flow_score.VisionFlowMLP
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'}
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    augment: false
    num_img: 2
    spatial_emb: 128
    time_dim: 32
    mlp_dims: [768,768,768]
    residual_style: true
    img_cond_steps: ${img_cond_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.ViTCritic
    spatial_emb: 128
    num_img: 2
    augment: false
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'}
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    img_cond_steps: ${img_cond_steps}
    mlp_dims: [256,256,256]
    activation_type: Mish
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  act_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  act_min: -1
  act_max: 1
  obs_dim: ${obs_dim}
  cond_steps: ${cond_steps}
  inference_steps: ${denoising_steps}
  randn_clip_value: 3
  epsilon_t: ${epsilon_t}
  logprob_min: -1.0
  logprob_max: 1.0
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  clip_vloss_coef: null
  denoised_clip_value: 1.0
  logprob_debug_sample: false
  logprob_debug_recalculate: false
  # ========== EpsNet 参数 ==========
  eps_mlp_hidden_dim: ${eps_mlp_hidden_dim}
  eps_mlp_type: ${eps_mlp_type}
  eps_max_clamp: ${eps_max_clamp}
