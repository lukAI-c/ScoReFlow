###################################
env_suite: robomimic
env_name: square

obs_dim: 9
cond_steps: 1
img_cond_steps: 1

action_dim: 7
horizon_steps: 4
act_steps: 4
###################################

defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.reinflow.train_ppo_flow_fpo_agent.TrainPPOFlowFPOAgent
name: ${env_name}_ft_fpo_mlp_img_ta${horizon_steps}_td${denoising_steps}_seed${seed}
logdir: ${oc.env:REINFLOW_LOG_DIR}/robomimic/finetune/${env_name}_ft_fpo_mlp_img_ta${horizon_steps}_td${denoising_steps}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: null
resume_path: null
robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}-img.json
normalization_path: ${oc.env:REINFLOW_DATA_DIR}/robomimic/${env_name}-img/normalization.npz

seed: 42
device: cuda:0
sim_device: cuda:0
###################################
denoising_steps: 4
min_std: 0.08
max_std: 0.14
###################################

env:
  n_envs: 50
  name: ${env_name}
  best_reward_threshold_for_success: 1 
  max_episode_steps: 400
  save_video: false
  use_image_obs: true
  wrappers:
    robomimic_image:
      normalization_path: ${normalization_path}
      low_dim_keys:
      - robot0_eef_pos
      - robot0_eef_quat
      - robot0_gripper_qpos
      image_keys:
      - agentview_image
      shape_meta: ${shape_meta}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true
shape_meta:
  obs:
    rgb:
      shape: [3,96,96]
    state:
      shape: [9]
  action:
    shape: [7]
wandb:
  entity: ${oc.env:REINFLOW_WANDB_ENTITY}
  project: robomimic-${env_name}-finetune-fpo
  run: ${now:%Y-%m-%d}_${now:%H-%M-%S}_${name}
  offline_mode: false
train:
  n_train_itr: 301
  n_critic_warmup_itr: 20  
  n_steps: 400
  gamma: 0.99  # 降低gamma，让agent更关注短期奖励
  augment: true
  grad_accumulate: 20
  n_samples_per_action: 8
  average_losses_before_exp: true
  buffer_on_gpu: false
  actor_lr: 1e-5  # 提高actor学习率，加快学习速度
  actor_weight_decay: 0
  actor_lr_scheduler:
    type: cosine
    first_cycle_steps: 300
    warmup_steps: 10
    min_lr: 1e-6
  critic_lr: 1e-4  # 提高critic学习率
  critic_weight_decay: 0
  critic_lr_scheduler:
    type: cosine
    first_cycle_steps: 300
    warmup_steps: 25
    min_lr: 1e-5
  save_model_freq: 100
  val_freq: 10
  render:
    freq: 1
    num: 0
  reward_scale_running: true
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 500
  logprob_batch_size: 1000
  update_epochs: 10
  vf_coef: 0.5
  ent_coef: 0.02  # 提高熵系数，鼓励更多探索
  target_kl: 0.02  # 放宽KL散度限制，允许更大的策略更新
  clipping_epsilon: 0.2
  lr_schedule: fixed
  repeat_samples: true
  verbose: false
  clip_intermediate_actions: true
  account_for_initial_stochasticity: true
  max_grad_norm: 1.0
  use_bc_loss: false
  bc_coeff: 0.1
model:
  _target_: model.flow.ft_ppo.ppoflow_fpo.PPOFlowFPO
  device: ${device}
  actor_policy_path: ${base_policy_path}
  policy:
    _target_: model.flow.mlp_flow.VisionFlowMLP
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'}
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    augment: false
    spatial_emb: 128
    time_dim: 32
    mlp_dims: [768,768,768]
    residual_style: true
    img_cond_steps: ${img_cond_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic:
    _target_: model.common.critic.ViTCritic
    spatial_emb: 128
    augment: false
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'}
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    img_cond_steps: ${img_cond_steps}
    mlp_dims: [256,256,256]
    activation_type: Mish
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  act_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  act_min: -1
  act_max: 1
  obs_dim: ${obs_dim}
  cond_steps: ${cond_steps}
  inference_steps: ${denoising_steps}
  denoised_clip_value: 1.0
  n_samples_per_action: ${train.n_samples_per_action}
  clipping_epsilon: ${train.clipping_epsilon}
  clip_vloss_coef: 0.0
  average_losses_before_exp: ${train.average_losses_before_exp}
  use_ema: true
