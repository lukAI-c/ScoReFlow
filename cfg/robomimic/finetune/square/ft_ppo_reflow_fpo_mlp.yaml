######################################################################
# FPO (Flow Policy Optimization) Finetune 配置 - Square 任务
#
# 核心区别: 使用 CFM 损失变化计算策略比率，而非显式似然
# 适用于 robomimic square (NutAssemblySquare) 任务
######################################################################
env_suite: robomimic
env_name: square

# 观测空间配置
# square 任务 lowdim 观测: robot0_eef_pos(3) + robot0_eef_quat(4) + robot0_gripper_qpos(2) + object(14) = 23
obs_dim: 23
cond_steps: 1
img_cond_steps: 1

# 动作空间配置 (Panda 机械臂: 6DoF + gripper)
action_dim: 7
horizon_steps: 4           # 预测未来动作的步数
act_steps: 4               # 实际执行的动作步数
######################################################################

defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}

# 使用 FPO 版本的训练脚本
_target_: agent.finetune.reinflow.train_ppo_flow_fpo_agent.TrainPPOFlowFPOAgent
name: ${env_name}_ft_reflow_fpo_ta${horizon_steps}_td${denoising_steps}_seed${seed}
logdir: ${oc.env:REINFLOW_LOG_DIR}/robomimic/finetune/${env_name}_ft_reflow_fpo_ta${horizon_steps}_td${denoising_steps}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}

# 预训练模型路径 (需要根据实际路径修改)
# 设置为 null 从随机初始化开始训练
base_policy_path: null
# base_policy_path: ${oc.env:REINFLOW_LOG_DIR}/robomimic/pretrain/square/ReFlow_FPO/state_2000.pt

robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}.json
normalization_path: ${oc.env:REINFLOW_DATA_DIR}/robomimic/${env_name}-img/normalization.npz

seed: 42
device: cuda:0

#########################
# Flow 采样步数
denoising_steps: 1
ft_denoising_steps: 1
#########################

# 环境配置
env:
  n_envs: 50                     # 并行环境数
  name: ${env_name}
  best_reward_threshold_for_success: 1  # 成功阈值
  max_episode_steps: 400         # Square 任务比 Lift 更长
  save_video: false
  use_image_obs: false           # 使用 lowdim 观测
  wrappers:
    robomimic_lowdim:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos',
                     'robot0_eef_quat',
                     'robot0_gripper_qpos',
                     'object']    # Square 任务需要物体状态
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true

# 观测形状元数据
shape_meta:
  obs:
    state:
      shape: [23]
  action: 
    shape: [7]

# WandB 配置
wandb:
  entity: ${oc.env:REINFLOW_WANDB_ENTITY}
  project: robomimic-${env_name}-finetune-fpo
  run: ${now:%Y-%m-%d}_${now:%H-%M-%S}_${name}
  offline_mode: false

# 训练配置
train:
  n_train_itr: 200               # 训练迭代次数 (Square 任务更难，可能需要更多)
  n_critic_warmup_itr: 5         # Critic 预热迭代次数
  n_steps: 400                   # 每次迭代收集的步数
  gamma: 0.999                   # 折扣因子
  
  # 学习率配置 (FPO 通常需要较小的学习率)
  actor_lr: 3e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    type: cosine
    first_cycle_steps: 100
    warmup_steps: 10
    min_lr: 1e-5
  
  critic_lr: 1e-4
  critic_weight_decay: 1.0e-5
  critic_lr_scheduler:
    type: cosine
    first_cycle_steps: 100
    warmup_steps: 10
    min_lr: 5e-5

  save_model_freq: 20            # 保存模型频率
  val_freq: 10                   # 验证频率
  
  render:
    freq: 1
    num: 0

  # PPO 参数
  reward_scale_running: true
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 1024               # 批量大小
  update_epochs: 10              # 每次更新的 epoch 数
  vf_coef: 0.5                   # 价值函数损失系数
  target_kl: 0.02                # KL 散度目标
  lr_schedule: fixed
  max_grad_norm: 0.5             # 梯度裁剪
  clipping_epsilon: 0.2          # PPO clip 参数
  
  # FPO 特定参数
  n_samples_per_action: 8        # CFM 损失采样数
  average_losses_before_exp: true # 先平均损失再取指数（更稳定）
  clip_intermediate_actions: true
  buffer_on_gpu: true            # 使用 GPU buffer 加速
  
  # BC 正则化（可选，防止策略偏离预训练太远）
  use_bc_loss: false
  bc_coeff: 0.1

# 使用 FPO 版本的模型
model:
  _target_: model.flow.ft_ppo.ppoflow_fpo.PPOFlowFPO
  device: ${device}
  actor_policy_path: ${base_policy_path}

  # 策略网络 (与预训练配置保持一致)
  policy:
    _target_: model.flow.mlp_flow.FlowMLP
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    time_dim: 32
    mlp_dims: [512, 512, 512]
    activation_type: Mish
    out_activation_type: Identity
    use_layernorm: false
    residual_style: true

  # Critic 网络
  critic:
    _target_: model.common.critic.CriticObs
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}

  # 动作空间配置
  act_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  act_min: -1
  act_max: 1
  obs_dim: ${obs_dim}
  cond_steps: ${cond_steps}

  # Flow 采样配置
  inference_steps: ${denoising_steps}
  denoised_clip_value: 1.0

  # FPO 特定参数
  n_samples_per_action: ${train.n_samples_per_action}
  clipping_epsilon: ${train.clipping_epsilon}
  clip_vloss_coef: 0.0           # 不使用价值裁剪
  average_losses_before_exp: ${train.average_losses_before_exp}
  use_ema: true                  # 加载 EMA 权重
