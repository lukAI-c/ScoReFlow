###################################
# Score-SDE Evaluation (Robomimic Transport with Image - ShortCut)
# 评估 Score-based SDE 方法的 finetuned 模型
###################################
env_name: transport

# future action forecasts
action_dim: 14     # two robots
horizon_steps: 8
act_steps: 8

# observation history
obs_dim: 18  # proprioception only, two robots
cond_steps: 1
img_cond_steps: 1

# observation shape
shape_meta:
  obs:
    rgb:
      shape: [6, 96, 96]
    state:
      shape: [18]
  action:
    shape: [14]
###################################

defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.eval.eval_reflow_img_agent_score.EvalImgScoreAgent

name: ${env_name}_eval_shortcut_score_mlp_img_ta${horizon_steps}_td${denoising_steps}
logdir: 
  ${oc.env:REINFLOW_LOG_DIR}/robomimic/eval/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path:  # 需要在命令行指定 finetuned 模型路径
robomimic_env_cfg_path: cfg/robomimic/env_meta/${env_name}-img.json
normalization_path: ${oc.env:REINFLOW_DATA_DIR}/robomimic/${env_name}-img/normalization.npz

load_ema: false
seed: 42
device: cuda:0
sim_device: cuda:0

# Score-SDE 参数
denoising_steps: 4
denoising_step_list: [1, 4]
gamma_score: 1.0
epsilon_t: 0.0  # 评估时无噪声
epsilon_schedule: constant
eval_mode: true

n_steps: 200
render_num: 0
batch_size: 128

env:
  n_envs: 10
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 800
  save_video: false
  use_image_obs: true
  wrappers:
    robomimic_image:
      normalization_path: ${normalization_path}
      low_dim_keys: ['robot0_eef_pos', 'robot0_eef_quat', 'robot0_gripper_qpos', 
                     'robot1_eef_pos', 'robot1_eef_quat', 'robot1_gripper_qpos']
      image_keys: ['shouldercamera0_image', 'shouldercamera1_image']
      shape_meta: ${shape_meta}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true
  render: true

model:
  _target_: model.flow.ft_ppo.pposhortcut_score.PPOShortCutScore
  device: ${device}
  gamma_score: ${gamma_score}
  actor_policy_path: null
  policy:
    _target_: model.flow.mlp_shortcut.ShortCutFlowViT
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    action_dim: ${action_dim}
    horizon_steps: ${horizon_steps}
    prop_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    img_cond_steps: ${img_cond_steps}
    td_emb_dim: 32
    mlp_dims: [768, 768, 768]
    cond_mlp_dims: [96, 48, 32]
    residual_style: true
    num_img: 2
    augment: false
    spatial_emb: 128
    embed_combination_type: 'add'
  critic:
    _target_: model.common.critic.ViTCritic
    spatial_emb: 128
    num_img: 2
    augment: false
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'}
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    img_cond_steps: ${img_cond_steps}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    out_bias_init: 4.0
  act_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  act_min: -1
  act_max: 1
  obs_dim: ${obs_dim}
  cond_steps: ${cond_steps}
  inference_steps: ${denoising_steps}
  randn_clip_value: 3
  epsilon_t: ${epsilon_t}
  logprob_min: -1.0
  logprob_max: 1.0
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.001
  clip_ploss_coef_rate: 3
  clip_vloss_coef: null
  denoised_clip_value: 1.0
  logprob_debug_sample: false
  logprob_debug_recalculate: false

