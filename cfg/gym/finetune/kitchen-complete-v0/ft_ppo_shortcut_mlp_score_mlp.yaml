######################################################################
env_name: kitchen-complete-v0

gamma_score: 1.0
# future action forecasts
action_dim: 9
horizon_steps: 4
act_steps: 4

# observation history
obs_dim: 60
cond_steps: 1
###################################################################
# EpsNet: learned ε(t) via MLP, drift & diffusion coupled (ShortCut)
# SDE: dxt = [vt + α(t)·st] dt + √(2·α(t)) dWt
###################################################################
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.reinflow.train_ppo_flow_agent_score_mlp.TrainPPOFlowEpsNetAgent
name: ${env_name}_ppo_shortcut_mlp_score_epsnet_ta${horizon_steps}_td${denoising_steps}_gamma${gamma_score}_seed${seed}
logdir: ${oc.env:REINFLOW_LOG_DIR}/gym/finetune/${env_name}_ppo_shortcut_mlp_score_epsnet_ta${horizon_steps}_td${denoising_steps}/${now:%Y-%m-%d}_${now:%H-%M-%S}_gamma${gamma_score}_seed${seed}
base_policy_path: ${oc.env:REINFLOW_LOG_DIR}/gym/pretrain/kitchen-complete-v0_pre_shortcut_mish_mlp_ta4_td4/2025-05-05_19-59-19_42/checkpoint/state_1500.pt
normalization_path: ${oc.env:REINFLOW_DATA_DIR}/gym/${env_name}/normalization.npz
resume_path: null
seed: 42
device: cuda:0
sim_device: cuda:0
denoising_steps: 4
# EpsNet parameters
epsilon_t: 0.1           # 基准噪声系数（用于初始化 MLP 输出量级）
eps_mlp_hidden_dim: 32   # EpsNet MLP 隐藏层维度
eps_mlp_type: mlp        # 'mlp', 'linear', 'fixed'
eps_max_clamp: 2.0       # α(t) 最大值裁剪倍率
env:
  n_envs: 40
  name: ${env_name}
  max_episode_steps: 280
  reset_at_iteration: false
  save_video: false
  best_reward_threshold_for_success: 4.0
  wrappers:
    mujoco_locomotion_lowdim:
      normalization_path: ${normalization_path}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true
wandb:
  entity: ${oc.env:REINFLOW_WANDB_ENTITY}
  project: gym-${env_name}-finetune
  run: ${now:%Y-%m-%d}_${now:%H-%M-%S}_${name}
  offline_mode: false
train:
  n_train_itr: 301
  n_critic_warmup_itr: 0
  n_steps: 200
  gamma: 0.99
  actor_lr: 4.5e-05
  actor_weight_decay: 0
  actor_lr_scheduler:
    type: cosine
    first_cycle_steps: 100
    warmup_steps: 10
    min_lr: 2.0e-05
  critic_lr: 0.00065
  critic_weight_decay: 1.0e-05
  critic_lr_scheduler:
    type: cosine
    first_cycle_steps: 100
    warmup_steps: 10
    min_lr: 0.0003
  save_model_freq: 300
  val_freq: 10
  render:
    freq: 1
    num: 0
  reward_scale_running: true
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 5600
  update_epochs: 10
  vf_coef: 0.5
  ent_coef: 0.0
  target_kl: 1.0
  lr_schedule: fixed
  repeat_samples: true
  verbose: false
  clip_intermediate_actions: true
  account_for_initial_stochasticity: true
model:
  _target_: model.flow.ft_ppo.pposhortcut_score_mlp.PPOShortCutScoreEpsNet
  device: ${device}
  #########################################################
  policy:
    _target_: model.flow.mlp_shortcut.ShortCutFlowMLP
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    td_emb_dim: 16
    mlp_dims: [256, 256, 256]
    cond_mlp_dims: [32, 16]
    activation_type: Mish
    out_activation_type: Identity
    use_layernorm: false
    residual_style: true
    embed_combination_type: 'add'
  #########################################################
  critic:
    _target_: model.common.critic.CriticObs
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256,256,256]
    activation_type: Mish
    residual_style: true
  actor_policy_path: ${base_policy_path}
  act_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  act_min: -1
  act_max: 1
  obs_dim: ${obs_dim}
  cond_steps: ${cond_steps}
  inference_steps: ${denoising_steps}
  epsilon_t: ${epsilon_t}
  gamma_score: ${gamma_score}
  # Common parameters
  randn_clip_value: 3
  logprob_min: -1.0
  logprob_max: 1.0
  clip_ploss_coef: 0.01
  clip_ploss_coef_base: 0.01
  clip_ploss_coef_rate: 3
  clip_vloss_coef: null
  denoised_clip_value: 1.0
  logprob_debug_sample: false
  logprob_debug_recalculate: false
  # ========== EpsNet 参数 ==========
  eps_mlp_hidden_dim: ${eps_mlp_hidden_dim}
  eps_mlp_type: ${eps_mlp_type}
  eps_max_clamp: ${eps_max_clamp}
